
name: Test Pushover

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Send test notification
        env:
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_API_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const user = process.env.PUSHOVER_USER_KEY;
          const token = process.env.PUSHOVER_API_TOKEN;

          if (!user || !token) {
            throw new Error("Missing Pushover credentials.");
          }

          const body = new URLSearchParams({
            token,
            user,
            title: "TEST - SoundCampaign Monitor",
            message: "Ceci est une notification de test. Le canal Pushover fonctionne !",
            priority: "0",
          });

          console.log("Sending test notification to Pushover...");

          const response = await fetch(
            "https://api.pushover.net/1/messages.json",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/x-www-form-urlencoded",
              },
              body,
              signal: AbortSignal.timeout(15000),
            }
          );

          let result;
          try {
            result = await response.json();
          } catch {
            throw new Error("Pushover returned an unreadable response.");
          }

          if (!response.ok || result?.status !== 1) {
            console.error("Pushover rejected the notification:", result);
            process.exit(1);
          }

          console.log("SUCCESS: Pushover accepted the test notification.");
          NODE
